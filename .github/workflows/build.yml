name: Build APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "gradlew not found, trying gradle..."
            gradle assembleDebug --no-daemon --stacktrace || exit 1
          fi

      - name: List APK
        run: |
          find . -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/ || true

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Черкаси 1.2 — v1.0.${{ github.run_number }}
          body: |
            Автоматична збірка додатку «Черкаси 1.2»
            
            Черга: **1.2**
            Джерело: офіційний канал @pat_cherkasyoblenergo
            
            Просто встановіть APK і дозвольте сповіщення.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
